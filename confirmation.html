<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Confirmation Poppy Clic</title>
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color:#222;background:#f7f4ef}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(620px,100%);background:#fff;border-radius:18px;padding:28px;box-shadow:0 12px 40px rgba(0,0,0,.10)}
    h1{margin:0 0 14px;font-size:28px}
    p{line-height:1.55}
    .details{background:#f6f6f6;border-radius:12px;padding:14px 16px;margin:18px 0}
    .details div{margin:6px 0}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
    button,a{font:inherit;border-radius:10px;padding:12px 18px;text-decoration:none}
    button{border:0;background:#198754;color:#fff;font-weight:700;cursor:pointer}
    a{border:1px solid #ccc;color:#333;background:#fff}
    .error{color:#a40000;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <h1 id="title">Confirmer cette action</h1>
    <p id="message">Vérifiez les informations ci-dessous puis cliquez sur « Confirmer ».</p>

    <div class="details" id="details"></div>

    <form id="confirmForm" method="post">
      <div class="actions">
        <button type="submit" id="confirmButton">Confirmer</button>
        <a href="javascript:history.back()">Annuler</a>
      </div>
    </form>

    <p class="error" id="error" hidden>Ce lien de confirmation n’est pas valide.</p>
  </main>

<script>
(() => {
  const params = new URLSearchParams(window.location.search);
  const hook = params.get('hook') || '';
  const action = params.get('action') || '';
  const allowedActions = new Set(['accept','accept_arrhes','contrat_accepte']);

  const form = document.getElementById('confirmForm');
  const details = document.getElementById('details');
  const error = document.getElementById('error');
  const title = document.getElementById('title');
  const message = document.getElementById('message');
  const button = document.getElementById('confirmButton');

  let validHook = false;
  try {
    const u = new URL(hook);
    validHook = u.protocol === 'https:' && u.hostname === 'hook.eu1.make.com';
  } catch (_) {}

  if (!validHook || !allowedActions.has(action)) {
    form.hidden = true;
    details.hidden = true;
    message.hidden = true;
    error.hidden = false;
    return;
  }

  const labels = {
    accept: {
      title: 'Accepter la réservation',
      button: 'Confirmer l’acceptation',
      text: 'La réservation sera acceptée sans arrhes.'
    },
    accept_arrhes: {
      title: 'Accepter avec 50 € d’arrhes',
      button: 'Confirmer avec arrhes',
      text: 'La réservation sera acceptée avec 50 € d’arrhes.'
    },
    contrat_accepte: {
      title: 'Accepter le contrat',
      button: 'J’accepte le contrat',
      text: 'Votre acceptation sera enregistrée uniquement après ce clic.'
    }
  };

  title.textContent = labels[action].title;
  button.textContent = labels[action].button;
  message.textContent = labels[action].text;

  const shown = [
    ['Référence', params.get('reference')],
    ['Date', params.get('date')],
    ['Prénom', params.get('prenom')],
    ['Nom', params.get('nom')],
    ['Formule', params.get('formule')]
  ].filter(([,v]) => v);

  details.innerHTML = shown.length
    ? shown.map(([k,v]) => `<div><strong>${escapeHtml(k)} :</strong> ${escapeHtml(v)}</div>`).join('')
    : '<div>Veuillez confirmer cette action.</div>';

  form.action = hook;

  for (const [key, value] of params.entries()) {
    if (key === 'hook') continue;
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = key;
    input.value = value;
    form.appendChild(input);
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
    })[c]);
  }
})();
</script>
</body>
</html>
