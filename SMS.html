<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMS Poppy Clic</title>
</head>
<body>

<p>Ouverture du SMS…</p>

<script>
const params = new URLSearchParams(window.location.search);
const tel = params.get('tel');

const message =
`Bonjour,

Votre date est pré-réservée pendant 48 heures. 📸

Pour confirmer votre réservation, merci de me retourner le contrat signé. Sans retour dans ce délai, la date sera libérée et redeviendra disponible.

Le contrat et les informations concernant votre réservation vous ont été envoyés par e-mail.

Si vous ne trouvez pas notre message dans votre boîte de réception, pensez à vérifier votre dossier Spam / Courriers indésirables.

À bientôt,

Nelly
SOS ORDI 03`;

if (tel) {
  window.location.href =
    'sms:' + tel + '?body=' + encodeURIComponent(message);
}
</script>

</body>
</html>
