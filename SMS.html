<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMS Poppy Clic</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f7f4ef;font-family:Arial,Helvetica,sans-serif;color:#222;padding:24px;box-sizing:border-box}
    .card{width:min(520px,100%);background:#fff;border-radius:18px;padding:28px;box-shadow:0 12px 35px rgba(0,0,0,.10);text-align:center}
    h1{margin:0 0 12px;font-size:26px}
    p{line-height:1.5;margin:0 0 20px}
    .button{display:inline-block;padding:14px 22px;border-radius:10px;background:#198754;color:#fff;text-decoration:none;font-weight:700;font-size:18px}
    .small{margin-top:18px;font-size:14px;color:#666}
  </style>
</head>
<body>

<main class="card">
  <h1>SMS Poppy Clic 📱</h1>
  <p>Le message est prêt. Touchez le bouton ci-dessous pour l’ouvrir dans votre application SMS.</p>
  <a id="open-sms" class="button" href="#">📱 Ouvrir le SMS</a>
  <p class="small">Le numéro et le message seront déjà préremplis.</p>
</main>

<script>
const params = new URLSearchParams(window.location.search);
const tel = params.get('tel') || '';
const prenom = params.get('prenom') || '';

const message =
`${prenom ? 'Bonjour ' + prenom : 'Bonjour'} 😊

Merci beaucoup pour votre réservation Poppy Clic 📸✨
Votre demande a bien été enregistrée et votre date est maintenant bloquée pendant 48 heures.

Pour confirmer définitivement votre réservation ✅, il vous suffit de me retourner par e-mail le contrat signé que je viens de vous envoyer.

Sans retour dans ce délai, la date sera libérée et redeviendra disponible.

Toutes les informations concernant votre réservation sont également indiquées dans cet e-mail 📩
Si vous ne le trouvez pas dans votre boîte de réception, pensez à vérifier vos spams / courriers indésirables.

À bientôt 😊
Nelly – Poppy Clic 🌸`;

const openSms = document.getElementById('open-sms');

if (tel) {
  openSms.href = 'sms:' + tel + '?body=' + encodeURIComponent(message);
} else {
  openSms.textContent = 'Numéro de téléphone manquant';
  openSms.removeAttribute('href');
}
</script>

</body>
</html>
